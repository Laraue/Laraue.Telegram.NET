name: Build and publish package

# Controls when the action will run. Triggers the workflow on push or pull request 
# events but only for the master branch
on:
  push:
    tags:
      - '*.*.*'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required so the job can request a GitHub OIDC token for NuGet trusted publishing
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@master

      - name: Set release env
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          
      - name: Setup .NET environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '10.0.x'
          
      - name: Build project
        run: |
          for p in $(find ./src -name *.csproj); do dotnet build $p --configuration Release; done
          
      - name: Run tests
        run: |
          for p in $(find ./tests -name *.csproj); do dotnet test $p; done

      - name: Generate a NuGet package
        run: dotnet pack -p:TargetFrameworks=${{env.PROJECT_TARGET}} -p:PackageVersion=${{env.RELEASE_VERSION}} --no-build -c Release -o .

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: win7user10

      - name: Push to NuGet.org
        run: dotnet nuget push "*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
